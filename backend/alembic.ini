# Alembic の設定。面倒を見るのは app/meta/tables.py のシステム表だけ(業務テーブルはアプリが DDL を流す。02 §4)
[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os
# 接続先は migrations/env.py が app.config から読む(.env の値をここに書かない)

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
