[project]
name = "works-api"
version = "0.1.0"
description = "自作 CRM「Works」の JSON API。契約は docs/design/04、振る舞いの正は frontend/src/mocks"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.53.0",
    "sqlalchemy>=2.0.54",
    "alembic>=1.20.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "psycopg[binary]>=3.3.6",
    "nh3>=0.3.7",
    "argon2-cffi>=25.1.0",
    "python-multipart>=0.0.32",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    # starlette の TestClient は httpx2 を使う(httpx は非推奨の警告を出す。2026-09-23 確認)
    "httpx2>=2.13.0",
    "ruff>=0.16.8",
    "mypy>=2.3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# E/F(pyflakes・pycodestyle)、I(import 順)、UP(新しい書き方)、B(bugbear)、SIM(単純化)
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
# SQLAlchemy Core を動的に組むので、Row の値は Any になる箇所がある
warn_return_any = false
disallow_any_generics = false

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# it の名前が表の ID で始まる(docs/tests/README.md §3 と同じ規則)
python_functions = ["test_*"]
# 非推奨に気づけるよう、警告はエラーにする(共通ルール)。ただし依存の中で出ていて、
# こちらでは直せないものだけをメッセージで名指しして外す。上げるたびに要るかどうか見直す
filterwarnings = [
    "error",
    # starlette 1.6.0 が anyio 4.15.1 の非推奨エイリアスを使っている(2026-09-23 確認。どちらも最新版)
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]
