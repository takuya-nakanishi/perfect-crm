# Twenty(オープンソース CRM)のセルフホスト。公式 packages/twenty-docker/docker-compose.yml(2026-09-20 取得)が元。
# 公式との差: ①イメージのタグを固定(公式手順が latest を受け付けない)②ポートは 127.0.0.1 のみ(外へは Cloudflare Tunnel 経由)
# ③.env の変数名に TWENTY_ を付ける(直下の .env を他の用途と共有するため)④APP_SECRET は legacy なので渡さない ⑤tunnel を足す
# 起動: `docker compose --profile public up -d`(profile を付けないと tunnel は起動しない)。手順は docs/twenty.md
name: twenty

x-twenty-env: &twenty-env
  PG_DATABASE_URL: postgres://postgres:${TWENTY_PG_PASSWORD:?set in .env}@db:5432/default
  SERVER_URL: ${TWENTY_SERVER_URL:?set in .env}
  REDIS_URL: redis://redis:6379
  STORAGE_TYPE: local
  ENCRYPTION_KEY: ${TWENTY_ENCRYPTION_KEY:?set in .env}

services:
  server:
    image: twentycrm/twenty:${TWENTY_TAG:-v2.41.0}
    volumes:
      - server-local-data:/app/packages/twenty-server/.local-storage
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      <<: *twenty-env
      NODE_PORT: 3000
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: curl --fail http://localhost:3000/healthz
      interval: 5s
      timeout: 5s
      retries: 20
    restart: always

  worker:
    image: twentycrm/twenty:${TWENTY_TAG:-v2.41.0}
    volumes:
      - server-local-data:/app/packages/twenty-server/.local-storage
    command: ["yarn", "worker:prod"]
    environment:
      <<: *twenty-env
      DISABLE_DB_MIGRATIONS: "true" # it already runs on the server
      DISABLE_CRON_JOBS_REGISTRATION: "true" # it already runs on the server
    depends_on:
      db:
        condition: service_healthy
      server:
        condition: service_healthy
    restart: always

  db:
    image: postgres:16
    volumes:
      - db-data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: default
      POSTGRES_PASSWORD: ${TWENTY_PG_PASSWORD:?set in .env}
      POSTGRES_USER: postgres
    healthcheck:
      test: pg_isready -U postgres -h localhost -d postgres
      interval: 5s
      timeout: 5s
      retries: 10
    restart: always

  redis:
    image: redis
    restart: always
    command: ["--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 外からの経路。Surface から Cloudflare へ外向きに張るだけで、受信ポートは開けない。
  # トークンは scripts/cloudflare-tunnel-setup.py が .env へ書く
  tunnel:
    image: cloudflare/cloudflared:latest
    restart: always
    profiles: ["public"]
    depends_on:
      server:
        condition: service_healthy
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:-}   # 空なら起動に失敗する(profile 外では評価されない)

volumes:
  db-data:
  server-local-data:
