# Works(自作 CRM)。Surface の WSL2 上の Docker で動かす。Windows 側の Docker Desktop は使わない。
#
#   docker compose --profile public up -d --build    画面 + Cloudflare Tunnel(https://works.sanei-clover.com)
#   docker compose up -d --build                     画面だけ(http://127.0.0.1:8610)
#   docker compose --profile backend up -d --build   API + PostgreSQL(画面から使うには VITE_API_MODE=http で web を建て直す)
#
# 手順と落とし穴(イメージの取得でつまずく点など)は docs/runbook/01-operations.md。
# api(Python バックエンド)と db は profile backend。構成は docs/design/03 §4・§10。
name: works

services:
  # 画面。ビルド済みの静的ファイルを Caddy で配る。無状態
  web:
    build:
      context: ./frontend
      args:
        VITE_API_MODE: ${VITE_API_MODE:-mock}
    image: works-web:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-8610}:8080" # ホストの中からだけ。外へは tunnel 経由
    read_only: true
    tmpfs:
      - /tmp
      - /config
      - /data
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE] # 公式イメージの caddy はこの権限付きのバイナリ。落とすと exec が operation not permitted で失敗する
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5

  # 外からの経路。Surface から Cloudflare へ外向きに張るだけで、受信ポートは開けない。
  # 行き先(works.sanei-clover.com → http://web:8080)と Access は scripts/cloudflare-tunnel-setup.py が Cloudflare 側に設定する
  tunnel:
    image: cloudflare/cloudflared:2026.9.1
    restart: unless-stopped
    profiles: ["public"]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-} # 空なら起動に失敗する(profile 外では使われない)
    depends_on:
      web:
        condition: service_healthy

  # JSON API(FastAPI)。契約は docs/design/04。画面とは Caddy 越しに同じオリジンで話す
  api:
    build: ./backend
    image: works-api:local
    restart: unless-stopped
    profiles: ["backend"]
    environment:
      WORKS_DB_HOST: db
      WORKS_DB_PASSWORD: ${WORKS_DB_PASSWORD:-}
      WORKS_SECRET_KEY: ${WORKS_SECRET_KEY:-} # 空だと再起動のたびに Google の繋ぎ直しになる
      # ログイン(03 §5 の B 案)。access = Cloudflare Access の JWT で利用者を決める。dev は Access の無い手元だけ
      WORKS_AUTH: ${WORKS_AUTH:-access}
      WORKS_ACCESS_TEAM_DOMAIN: ${WORKS_ACCESS_TEAM_DOMAIN:-} # scripts/cloudflare-tunnel-setup.py が書く
      WORKS_ACCESS_AUD: ${WORKS_ACCESS_AUD:-}
      WORKS_SECURE_COOKIE: ${WORKS_SECURE_COOKIE:-true} # dev を http で開くときだけ false
      WORKS_ADMIN_EMAIL: ${WORKS_ADMIN_EMAIL:-} # 最初の管理者(初回だけ作る)
      WORKS_ADMIN_NAME: ${WORKS_ADMIN_NAME:-管理者}
      # Google ドライブ(04 §8)。空ならドライブの API は 503 を返す。作り方は docs/runbook/01 §6
      WORKS_GOOGLE_CLIENT_ID: ${WORKS_GOOGLE_CLIENT_ID:-}
      WORKS_GOOGLE_CLIENT_SECRET: ${WORKS_GOOGLE_CLIENT_SECRET:-}
      WORKS_GOOGLE_REDIRECT_URI: ${WORKS_GOOGLE_REDIRECT_URI:-https://works.sanei-clover.com/api/v1/google/callback}
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 5

  # PostgreSQL。ホストへは 127.0.0.1 からだけ開ける(pytest が実物に繋ぐため。scripts/verify.sh)
  db:
    image: postgres:18.6-alpine
    restart: unless-stopped
    profiles: ["backend"]
    environment:
      POSTGRES_DB: works
      POSTGRES_USER: works
      POSTGRES_PASSWORD: ${WORKS_DB_PASSWORD:-}
    ports:
      - "127.0.0.1:${WORKS_DB_PORT:-55432}:5432" # ホストの中からだけ。外へは出さない
    volumes:
      - db-data:/var/lib/postgresql # 18 系からデータは /var/lib/postgresql/18/docker。/data を指すと空のまま起動する
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U works -d works"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
