name: contacts
services:
  db:
    image: postgres:16-alpine
    container_name: contacts-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: contacts
      POSTGRES_PASSWORD: ${CONTACTS_DB_PASSWORD:?set in .env}
      POSTGRES_DB: contacts
      TZ: Asia/Tokyo
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - contacts-db-data:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contacts -d contacts"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 画面ツールは今は置いていない(NocoDB は 2026-09-20 に撤去。docs/contacts.md)。
  # .env はリポジトリ直下に 1 つだけ置くので、このディレクトリで compose を使うときは常に --env-file ../.env を付ける

  # 外からの経路(画面を置いたときに使う)。Surface から Cloudflare へ外向きに張るだけで、受信ポートは開けない。
  # `docker compose --env-file ../.env --profile public up -d` で起動(トークンは scripts/cloudflare-tunnel-setup.py が直下の .env へ書く)。
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: contacts-tunnel
    restart: unless-stopped
    profiles: ["public"]
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:-}   # 空なら起動に失敗する(profile 外では評価されない)
volumes:
  contacts-db-data:
